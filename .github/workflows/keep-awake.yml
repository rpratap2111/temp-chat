name: Keep backend awake

# Render's free tier sleeps after 15 idle minutes.
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --retry 2 https://temp-chat-ixiv.onrender.com/api/health
